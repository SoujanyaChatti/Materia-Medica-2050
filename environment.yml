name: dioscorides
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26
  - pandas=2.2
  - pyarrow=16
  - geopandas=0.14
  - shapely=2.0
  - pyproj=3.6
  - gdal=3.8          # OSM .pbf driver used for harvest-pressure proxy
  - rasterio=1.3
  - rioxarray=0.15
  - xarray=2024.3
  - scikit-learn=1.4
  - scipy=1.13
  - requests=2.31
  - pyyaml=6.0
  - jsonschema=4.22
  - python-dotenv=1.0
  - pytest=8.2
  - pip
  - pip:
      - pygbif==0.6.4
      - elapid==1.0.2
