name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy scipy jsonschema pyyaml pytest
      - uses: actions/setup-node@v4
        with: { node-version: "22.22", cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
        working-directory: site
      # If no real export is committed yet, validate the sample data against the schema instead.
      - run: test -f site/public/data/meta.json || (cd site && npm run data:sample)
      - run: python -m pytest -q   # cleaning, risk maths, and the export JSON Schema

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.22", cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
        working-directory: site
      - run: test -f public/data/meta.json || npm run data:sample
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
